<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄英雄 - 游戏化全能番茄钟</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #E53935;
            --secondary-color: #43A047;
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --text-dim: #B0B0B0;
            --accent-color: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .view {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auth Form */
        .auth-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 50px;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #2C2C2C;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #C62828; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-ghost { background: #2C2C2C; color: var(--text-dim); }

        /* Timer Section */
        .timer-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .timer-display {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
        }

        .timer-svg { transform: rotate(-90deg); }
        .timer-bg { fill: none; stroke: #333; stroke-width: 8; }
        .timer-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.5s;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
        }

        /* Settings & Tasks */
        .config-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .setting-row {
            margin-bottom: 15px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary-color);
        }

        .recent-tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .task-chip {
            background: #2C2C2C;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #444;
            transition: 0.3s;
        }

        .task-chip:hover { border-color: var(--primary-color); color: var(--primary-color); }

        /* Stats & Chart */
        .stats-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            margin-top: 15px;
        }

        .stats-summary {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .summary-item { text-align: center; }
        .summary-value { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .summary-label { font-size: 12px; color: var(--text-dim); }

        /* Levels & EXP */
        .exp-bar-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .exp-progress-bg { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .exp-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), #FF7043); width: 0%; transition: 0.5s; }

        /* Leaderboard */
        .leaderboard-list { list-style: none; margin-top: 15px; }
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .rank { width: 30px; font-weight: bold; color: var(--primary-color); }
        .user-info { flex-grow: 1; }
        .user-count { text-align: right; }

        /* Effects */
        .achievement-toast {
            position: fixed;
            bottom: 20px;
            right: -350px;
            background: #333;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.5s;
            z-index: 1000;
            border-left: 4px solid var(--accent-color);
        }
        .achievement-toast.show { right: 20px; }

        #level-up-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            flex-direction: column; z-index: 2000;
        }

        .floating-exp {
            position: fixed; color: var(--accent-color); font-weight: bold; font-size: 30px;
            pointer-events: none; animation: floatUp 1.5s forwards; z-index: 1500;
        }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-150px); opacity: 0; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth -->
    <div id="auth-view" class="view active">
        <div class="auth-card">
            <h2 id="auth-title">番茄英雄</h2>
            <div class="input-group" id="username-group" style="display: none;">
                <label>英雄名</label>
                <input type="text" id="auth-username" placeholder="输入您的显示名称">
            </div>
            <div class="input-group">
                <label>邮箱</label>
                <input type="email" id="auth-email" placeholder="example@mail.com">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" id="auth-submit">进入竞技场</button>
            <div style="text-align: center; margin-top: 15px; cursor: pointer; color: var(--text-dim);" id="auth-toggle">还没有账号？点此注册</div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-view" class="view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 id="display-username">Hero</h2>
                <span id="display-title" style="font-size: 12px; color: var(--text-dim);">新手学徒</span>
            </div>
            <button class="btn btn-ghost" id="logout-btn" style="width: auto; padding: 5px 15px;">登出</button>
        </div>

        <div class="exp-bar-container">
            <div style="display: flex; justify-content: space-between; font-size: 14px;">
                <span>等级 <span id="display-level">1</span></span>
                <span><span id="display-exp">0</span> / <span id="display-next-exp">300</span> EXP</span>
            </div>
            <div class="exp-progress-bg">
                <div class="exp-progress-fill" id="exp-fill"></div>
            </div>
        </div>

        <div class="config-card" id="config-panel">
            <div class="setting-row">
                <label style="display: block; margin-bottom: 10px; font-size: 14px; color: var(--text-dim);">正在做什么？</label>
                <input type="text" id="task-name-input" placeholder="输入当前任务..." style="width: 100%; padding: 10px; background: #2C2C2C; border: 1px solid #444; border-radius: 8px; color: white;">
                <div class="recent-tasks" id="recent-tasks-list">
                    <!-- Quick select chips -->
                </div>
            </div>
            <div class="setting-row">
                <label style="display: block; margin-bottom: 10px; font-size: 14px; color: var(--text-dim);">专注时间: <span id="timer-setting-val">25</span> 分钟</label>
                <div class="slider-container">
                    <span>5</span>
                    <input type="range" id="timer-slider" min="5" max="120" value="25" step="5">
                    <span>120</span>
                </div>
            </div>
        </div>

        <div class="timer-card">
            <div id="timer-mode-label" style="font-size: 18px; margin-bottom: 10px;">准备就绪</div>
            <div class="timer-display" id="timer-anchor">
                <svg class="timer-svg" width="220" height="220">
                    <circle class="timer-bg" cx="110" cy="110" r="100"></circle>
                    <circle class="timer-progress" id="timer-progress" cx="110" cy="110" r="100" stroke-dasharray="628.3" stroke-dashoffset="0"></circle>
                </svg>
                <div class="timer-text" id="timer-text">25:00</div>
            </div>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
                <button class="btn btn-primary" id="timer-start" style="width: 120px;">开始专注</button>
                <button class="btn btn-outline hidden" id="timer-stop" style="width: 120px;">放弃任务</button>
            </div>
        </div>

        <!-- Data Analysis -->
        <div class="stats-card">
            <h3>数据分析</h3>
            <div class="stats-summary">
                <div class="summary-item">
                    <div class="summary-value" id="stat-today-time">0</div>
                    <div class="summary-label">今日时长(分)</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="stat-total-tomatoes">0</div>
                    <div class="summary-label">累计番茄</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="taskChart"></canvas>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="stats-card">
            <h3>英雄榜 (Top 10)</h3>
            <ul class="leaderboard-list" id="leaderboard-list"></ul>
        </div>
    </div>
</div>

<!-- Achievement Toast -->
<div id="achievement-toast" class="achievement-toast">
    <div style="font-size: 30px;">🏆</div>
    <div>
        <div style="font-weight: bold;">成就解锁！</div>
        <div id="achievement-name" style="font-size: 14px; color: var(--text-dim);"></div>
    </div>
</div>

<!-- Level Up -->
<div id="level-up-overlay">
    <h1 style="color: var(--accent-color); font-size: 60px; text-shadow: 0 0 20px rgba(255,215,0,0.5);">LEVEL UP!</h1>
    <p id="new-title-display" style="font-size: 24px; margin: 20px 0;">获得称号：专注骑士</p>
    <button class="btn btn-primary" style="width: auto; padding: 10px 40px;" onclick="document.getElementById('level-up-overlay').style.display='none'">继续我的英雄之路</button>
</div>

<script>
    // --- Configuration ---
    const SUPABASE_URL = 'https://htshfxvqsscgdzjcrcpr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7I655eAMx6ZCbBiUlwisoA__bpEgH3X';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- State ---
    let user = null;
    let profile = { id: '', username: 'Hero', level: 1, exp: 0, total_tomatoes: 0 };
    let sessions = [];
    let recentTasks = JSON.parse(localStorage.getItem('recent_tasks') || '["写代码", "学习", "运动", "阅读"]');

    let timer = {
        totalSeconds: 25 * 60,
        remainingSeconds: 25 * 60,
        interval: null,
        isRunning: false,
        mode: 'work', // 'work', 'break'
        streak: 0,
        currentTask: ''
    };

    let taskChart = null;

    // --- Init ---
    async function init() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            user = session.user;
            await loadData();
            showView('app');
        } else {
            showView('auth');
        }
        updateUI();
        initChart();
    }

    function showView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(name + '-view').classList.add('active');
    }

    // --- Auth ---
    const authToggle = document.getElementById('auth-toggle');
    let isLogin = true;
    authToggle.onclick = () => {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? '番茄英雄' : '注册英雄';
        document.getElementById('auth-submit').innerText = isLogin ? '进入竞技场' : '完成注册';
        authToggle.innerText = isLogin ? '还没有账号？点此注册' : '已有账号？去登录';
        document.getElementById('username-group').style.display = isLogin ? 'none' : 'block';
    };

    document.getElementById('auth-submit').onclick = async () => {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value;

        try {
            if (isLogin) {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                user = data.user;
            } else {
                const { data, error } = await db.auth.signUp({
                    email, password, options: { data: { username: username || email.split('@')[0] } }
                });
                if (error) throw error;
                user = data.user;
                if (!data.session) return alert("注册成功！请检查邮箱（如果开启了验证）或直接登录。");
            }
            await loadData();
            showView('app');
        } catch (e) { alert(e.message); }
    };

    document.getElementById('logout-btn').onclick = async () => {
        await db.auth.signOut();
        location.reload();
    };

    // --- Data Management ---
    async function loadData() {
        if (!user) return;

        // Profile (Auto-create if missing)
        let { data: prof } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (!prof) {
            const initial = { id: user.id, username: user.user_metadata.username || user.email.split('@')[0], level: 1, exp: 0 };
            const { data } = await db.from('profiles').insert(initial).select().single();
            prof = data;
        }
        profile = prof;

        // Sessions
        const { data: sess } = await db.from('tomato_sessions').select('*').eq('user_id', user.id);
        sessions = sess || [];

        updateUI();
        updateCharts();
        refreshLeaderboard();
    }

    async function saveSession(duration, taskName) {
        const expGain = duration * 4 + (timer.streak > 1 ? 50 : 0);
        const oldLevel = profile.level;

        profile.exp += expGain;
        profile.total_tomatoes += 1;
        profile.level = calculateLevel(profile.exp);

        // Update DB
        await db.from('tomato_sessions').insert({
            user_id: user.id,
            duration: duration,
            task_name: taskName,
            completed_at: new Date().toISOString()
        });

        await db.from('profiles').upsert({
            id: user.id,
            exp: profile.exp,
            level: profile.level,
            total_tomatoes: profile.total_tomatoes,
            updated_at: new Date().toISOString()
        });

        if (profile.level > oldLevel) showLevelUp();
        spawnExpEffect(expGain);
        loadData(); // Reload to update charts/leaderboard
    }

    // --- Timer Logic ---
    const slider = document.getElementById('timer-slider');
    const sliderVal = document.getElementById('timer-setting-val');
    slider.oninput = () => {
        if (!timer.isRunning) {
            sliderVal.innerText = slider.value;
            timer.totalSeconds = slider.value * 60;
            timer.remainingSeconds = timer.totalSeconds;
            updateTimerUI();
        }
    };

    document.getElementById('timer-start').onclick = () => {
        if (timer.isRunning) return;

        const taskInput = document.getElementById('task-name-input').value.trim();
        timer.currentTask = taskInput || '专注任务';

        // Add to recent if new
        if (taskInput && !recentTasks.includes(taskInput)) {
            recentTasks.unshift(taskInput);
            recentTasks = recentTasks.slice(0, 8);
            localStorage.setItem('recent_tasks', JSON.stringify(recentTasks));
            renderRecentTasks();
        }

        timer.isRunning = true;
        document.getElementById('timer-start').classList.add('hidden');
        document.getElementById('timer-stop').classList.remove('hidden');
        document.getElementById('config-panel').style.opacity = '0.5';
        document.getElementById('config-panel').style.pointerEvents = 'none';

        timer.interval = setInterval(tick, 1000);
    };

    document.getElementById('timer-stop').onclick = () => {
        if (confirm("确定要放弃这次任务吗？进度将不被保存，且连击会重置。")) {
            timer.streak = 0;
            resetTimer();
        }
    };

    function tick() {
        if (timer.remainingSeconds > 0) {
            timer.remainingSeconds--;
            updateTimerUI();
        } else {
            completeTimer();
        }
    }

    async function completeTimer() {
        clearInterval(timer.interval);
        timer.isRunning = false;

        if (timer.mode === 'work') {
            timer.streak++;
            await saveSession(parseInt(slider.value), timer.currentTask);

            // Switch to break
            timer.mode = 'break';
            const breakMin = (timer.streak % 4 === 0) ? 15 : 5;
            timer.totalSeconds = breakMin * 60;
            document.getElementById('timer-mode-label').innerText = '休息时间';
            document.getElementById('timer-progress').style.stroke = 'var(--secondary-color)';
        } else {
            timer.mode = 'work';
            timer.totalSeconds = slider.value * 60;
            document.getElementById('timer-mode-label').innerText = '准备就绪';
            document.getElementById('timer-progress').style.stroke = 'var(--primary-color)';
        }

        timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        document.getElementById('config-panel').style.opacity = '1';
        document.getElementById('config-panel').style.pointerEvents = 'auto';
        updateTimerUI();
    }

    function resetTimer() {
        clearInterval(timer.interval);
        timer.isRunning = false;
        timer.mode = 'work';
        timer.totalSeconds = slider.value * 60;
        timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        document.getElementById('config-panel').style.opacity = '1';
        document.getElementById('config-panel').style.pointerEvents = 'auto';
        document.getElementById('timer-mode-label').innerText = '准备就绪';
        document.getElementById('timer-progress').style.stroke = 'var(--primary-color)';
        updateTimerUI();
    }

    // --- UI Helpers ---
    function updateUI() {
        document.getElementById('display-username').innerText = profile.username;
        document.getElementById('display-title').innerText = getTitle(profile.level);
        document.getElementById('display-level').innerText = profile.level;
        document.getElementById('display-exp').innerText = Math.floor(getExpInLevel(profile.exp, profile.level));
        document.getElementById('display-next-exp').innerText = Math.floor(getRequiredExp(profile.level));
        document.getElementById('exp-fill').style.width = (getExpInLevel(profile.exp, profile.level) / getRequiredExp(profile.level) * 100) + '%';

        document.getElementById('stat-total-tomatoes').innerText = profile.total_tomatoes;

        renderRecentTasks();
        updateTimerUI();
    }

    function updateTimerUI() {
        const m = Math.floor(timer.remainingSeconds / 60);
        const s = timer.remainingSeconds % 60;
        document.getElementById('timer-text').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        const offset = 628.3 * (1 - timer.remainingSeconds / timer.totalSeconds);
        document.getElementById('timer-progress').style.strokeDashoffset = offset;
    }

    function renderRecentTasks() {
        const list = document.getElementById('recent-tasks-list');
        list.innerHTML = recentTasks.map(t => `<span class="task-chip" onclick="selectTask('${t}')">${t}</span>`).join('');
    }

    window.selectTask = (name) => {
        document.getElementById('task-name-input').value = name;
    };

    // --- Formulas ---
    function calculateLevel(exp) {
        let lvl = 1, req = 300, total = 0;
        while (exp >= total + req) { total += req; lvl++; req *= 1.5; }
        return lvl;
    }
    function getRequiredExp(lvl) {
        let req = 300;
        for(let i=1; i<lvl; i++) req *= 1.5;
        return req;
    }
    function getExpInLevel(exp, lvl) {
        let total = 0, req = 300;
        for(let i=1; i<lvl; i++) { total += req; req *= 1.5; }
        return exp - total;
    }
    function getTitle(lvl) {
        if (lvl >= 20) return "传说番茄王";
        if (lvl >= 10) return "时间法师";
        if (lvl >= 5) return "专注骑士";
        return "新手学徒";
    }

    // --- Charts ---
    function initChart() {
        const ctx = document.getElementById('taskChart').getContext('2d');
        taskChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: ['#E53935', '#43A047', '#1E88E5', '#FB8C00', '#8E24AA', '#00ACC1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right', labels: { color: '#B0B0B0' } } }
            }
        });
    }

    function updateCharts() {
        const todayStr = new Date().toLocaleDateString();
        const todaySessions = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === todayStr);

        const totalMinutes = todaySessions.reduce((acc, s) => acc + s.duration, 0);
        document.getElementById('stat-today-time').innerText = totalMinutes;

        // Task Distribution
        const taskMap = {};
        todaySessions.forEach(s => {
            taskMap[s.task_name] = (taskMap[s.task_name] || 0) + s.duration;
        });

        if (taskChart) {
            taskChart.data.labels = Object.keys(taskMap);
            taskChart.data.datasets[0].data = Object.values(taskMap);
            taskChart.update();
        }
    }

    async function refreshLeaderboard() {
        const { data } = await db.from('profiles').select('username, total_tomatoes, level').order('total_tomatoes', { ascending: false }).limit(10);
        if (data) {
            document.getElementById('leaderboard-list').innerHTML = data.map((u, i) => `
                <li class="leaderboard-item">
                    <span class="rank">${i+1}</span>
                    <div class="user-info">
                        <div style="font-weight:bold">${u.username}</div>
                        <div style="font-size:10px; color:var(--text-dim)">Lv.${u.level} ${getTitle(u.level)}</div>
                    </div>
                    <div class="user-count">
                        <div style="color:var(--primary-color); font-weight:bold">${u.total_tomatoes}</div>
                        <div style="font-size:10px; color:var(--text-dim)">番茄</div>
                    </div>
                </li>
            `).join('');
        }
    }

    // --- Feedback ---
    function spawnExpEffect(exp) {
        const anchor = document.getElementById('timer-anchor');
        const rect = anchor.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'floating-exp';
        el.innerText = `+${exp} EXP`;
        el.style.left = (rect.left + rect.width/2 - 40) + 'px';
        el.style.top = (rect.top + rect.height/2) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    function showLevelUp() {
        document.getElementById('new-title-display').innerText = `获得称号：${getTitle(profile.level)}`;
        document.getElementById('level-up-overlay').style.display = 'flex';
    }

    init();
</script>
</body>
</html>
