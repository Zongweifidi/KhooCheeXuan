<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄英雄 | 极简主义专业专注空间</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.4);
            --primary: #F43F5E;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --secondary: #10B981;
            --secondary-glow: rgba(16, 185, 129, 0.4);
            --accent: #F59E0B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --sidebar-width: 280px;
            --header-height: 80px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
        }

        /* --- 动态液态背景 --- */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: #020617;
            overflow: hidden;
        }

        .mesh-circle {
            position: absolute;
            filter: blur(80px);
            opacity: 0.35;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: liquidMove 20s infinite alternate ease-in-out;
        }

        .circle-1 { width: 800px; height: 800px; background: radial-gradient(circle, #312e81, transparent); top: -20%; left: -10%; animation-duration: 25s; }
        .circle-2 { width: 600px; height: 600px; background: radial-gradient(circle, #4c1d95, transparent); bottom: -10%; right: -10%; animation-duration: 18s; animation-delay: -5s; }
        .circle-3 { width: 500px; height: 500px; background: radial-gradient(circle, #1e40af, transparent); top: 30%; right: 20%; animation-duration: 22s; animation-delay: -10s; }

        @keyframes liquidMove {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(10%, 15%) scale(1.2) rotate(120deg); }
            66% { transform: translate(-5%, 10%) scale(0.9) rotate(240deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- 侧边栏 --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar-header { padding: 32px; display: flex; align-items: center; gap: 12px; }
        .logo-box {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 16px var(--primary-glow);
        }

        .sidebar-nav { flex-grow: 1; padding: 0 16px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px; border-radius: 14px; color: var(--text-muted);
            text-decoration: none; font-weight: 600; margin-bottom: 8px;
            transition: var(--transition); cursor: pointer;
        }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .nav-link.active i { color: var(--primary); }
        .sidebar-footer { padding: 24px; border-top: 1px solid var(--border); }

        /* --- 主内容 --- */
        .main-content { flex-grow: 1; margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
        .header {
            height: var(--header-height); padding: 0 40px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(15, 23, 42, 0.2); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90;
        }
        .content-body { padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .glass-card {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 28px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
            margin-bottom: 32px; transition: var(--transition);
        }
        .glass-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

        /* --- 计时器 --- */
        .timer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
        .timer-circle { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .timer-svg { transform: rotate(-90deg); }
        .timer-track { fill: none; stroke: rgba(255,255,255,0.03); stroke-width: 10; }
        .timer-bar {
            fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round;
            stroke-dasharray: 879.6; stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s linear, stroke 0.5s;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }
        .timer-content { position: absolute; text-align: center; }
        .timer-time { font-size: 64px; font-weight: 800; letter-spacing: -2px; }
        .timer-label { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        /* --- 按钮 --- */
        .btn {
            padding: 14px 28px; border-radius: 14px; border: none; font-weight: 700;
            cursor: pointer; transition: var(--transition); display: flex;
            align-items: center; gap: 8px; justify-content: center;
        }
        .btn-primary { background: linear-gradient(135deg, #F43F5E, #E11D48); color: white; box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.4); }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 15px 30px -5px rgba(244, 63, 94, 0.5); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--primary); }

        .auth-overlay { position: fixed; inset: 0; background: var(--bg-deep); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 100%; max-width: 440px; padding: 40px; background: var(--bg-card); border-radius: 32px; border: 1px solid var(--glass-border); text-align: center; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.2); border: 1.5px solid var(--border);
            border-radius: 14px; color: white; font-size: 15px; outline: none; transition: var(--transition);
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        .hidden { display: none !important; }
        .text-rose { color: var(--primary); }
    </style>
</head>
<body>

<div class="mesh-bg"><div class="mesh-circle circle-1"></div><div class="mesh-circle circle-2"></div><div class="mesh-circle circle-3"></div></div>
<div class="noise-overlay"></div>

<div id="auth-view" class="auth-overlay view active">
    <div class="auth-card">
        <div class="logo-box" style="margin: 0 auto 24px;"><i data-lucide="timer" style="color: white;"></i></div>
        <h1>番茄英雄</h1><p style="color: var(--text-muted); margin-bottom: 32px;">开启您的专注传奇</p>
        <div id="username-group" class="input-group hidden"><label>英雄名称</label><input type="text" id="auth-username" placeholder="输入您的名号"></div>
        <div class="input-group"><label>邮箱地址</label><input type="email" id="auth-email" placeholder="hero@example.com"></div>
        <div class="input-group"><label>通行密钥</label><input type="password" id="auth-password" placeholder="••••••••"></div>
        <button class="btn btn-primary" id="auth-submit" style="width: 100%;">进入竞技场</button>
        <p id="auth-toggle" style="margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;">新挑战者？ <span class="text-rose">立即注册</span></p>
    </div>
</div>

<aside class="sidebar hidden" id="main-sidebar">
    <div class="sidebar-header"><div class="logo-box"><i data-lucide="zap" style="color: white; width: 20px;"></i></div><h2 class="logo-text">番茄英雄</h2></div>
    <div class="sidebar-nav">
        <div class="nav-link active" onclick="switchTab('focus')"><i data-lucide="clock"></i><span class="nav-text">专注空间</span></div>
        <div class="nav-link" onclick="switchTab('analytics')"><i data-lucide="bar-chart-3"></i><span class="nav-text">数据分析</span></div>
        <div class="nav-link" onclick="switchTab('leaderboard')"><i data-lucide="trophy"></i><span class="nav-text">英雄榜单</span></div>
    </div>
    <div class="sidebar-footer"><button class="btn btn-outline" id="logout-btn" style="width: 100%;"><i data-lucide="log-out"></i><span>登出</span></button></div>
</aside>

<main class="main-content hidden" id="main-app">
    <header class="header">
        <div style="display: flex; align-items: center; gap: 16px;">
            <div class="logo-box" style="width: 44px; height: 44px; border-radius: 50%;" id="avatar-container">H</div>
            <div><h3 id="display-username">传奇英雄</h3><p style="font-size: 12px; color: var(--primary); font-weight: 700;" id="display-title">新晋进修学徒</p></div>
        </div>
        <div style="text-align: right;"><p style="font-size: 11px; color: var(--text-muted); font-weight: 700;">当前等级</p><p style="font-size: 18px; font-weight: 800; color: var(--primary);">LV.<span id="display-level">1</span></p></div>
    </header>
    <div class="content-body">
        <div id="tab-focus" class="tab-content">
            <div class="glass-card timer-container">
                <div id="mode-badge" style="background: rgba(244,63,94,0.1); color: var(--primary); padding: 8px 20px; border-radius: 100px; font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-bottom: 30px;">准备专注</div>
                <div class="timer-circle" id="timer-anchor">
                    <svg class="timer-svg" width="300" height="300"><circle class="timer-track" cx="150" cy="150" r="140"></circle><circle class="timer-bar" id="timer-progress" cx="150" cy="150" r="140"></circle></svg>
                    <div class="timer-content"><p class="timer-time" id="timer-text">25:00</p><p class="timer-label">分钟</p></div>
                </div>
                <div style="width: 100%; max-width: 400px; display: flex; gap: 16px; margin-top: 40px;">
                    <button class="btn btn-primary" id="timer-start" style="flex: 2;"><i data-lucide="play" fill="white"></i> 开启专注</button>
                    <button class="btn btn-outline hidden" id="timer-stop" style="flex: 1;">放弃</button>
                </div>
            </div>
            <div class="glass-card">
                <h3 style="margin-bottom: 24px;"><i data-lucide="edit-3"></i> 任务配置</h3>
                <div class="input-group"><label>当前目标</label><input type="text" id="task-name-input" placeholder="您现在要征服什么？"></div>
                <div id="recent-tasks-list" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;"></div>
                <div class="input-group"><label style="display: flex; justify-content: space-between;">专注时长 <span><span id="timer-setting-val" class="text-rose">25</span> 分钟</span></label><input type="range" id="timer-slider" min="5" max="120" value="25" step="5" style="accent-color: var(--primary); width:100%;"></div>
            </div>
        </div>
        <div id="tab-analytics" class="tab-content hidden">
            <div class="glass-card"><h3>本周专注趋势</h3><div style="height: 300px;"><canvas id="weeklyChart"></canvas></div></div>
            <div class="glass-card"><h3>任务时间分配</h3><div style="height: 300px;"><canvas id="taskChart"></canvas></div></div>
        </div>
        <div id="tab-leaderboard" class="tab-content hidden"><div class="glass-card"><h3>英雄榜单</h3><div id="leaderboard-list"></div></div></div>
    </div>
</main>

<div id="level-up-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <h1 style="color: var(--accent); font-size: 72px; text-shadow: 0 0 30px var(--accent);">等级提升!</h1>
    <p id="new-title-display" style="font-size: 24px; font-weight: 700; margin: 20px 0;">获得称号：专注骑士</p>
    <button class="btn btn-primary" onclick="this.parentElement.classList.add('hidden')" style="width: auto; padding: 16px 48px;">继续征途</button>
</div>

<script>
    lucide.createIcons();

    // --- 配置 & 状态 ---
    let SUPABASE_URL = 'https://htshfxvqsscgdzjcrcpr.supabase.co';
    // URL 清洗逻辑
    SUPABASE_URL = SUPABASE_URL.split('/rest/v1')[0].replace(/\/$/, '');
    const SUPABASE_ANON_KEY = 'sb_publishable_7I655eAMx6ZCbBiUlwisoA__bpEgH3X';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let user = null;
    let profile = { id: '', username: '英雄', level: 1, exp: 0, total_tomatoes: 0 };
    let sessions = [];
    let recentTasks = JSON.parse(localStorage.getItem('recent_tasks') || '["写代码", "阅读", "学习"]');

    let timer = { totalSeconds: 25 * 60, remainingSeconds: 25 * 60, interval: null, isRunning: false, mode: 'work', streak: 0, currentTask: '' };
    let taskChart, weeklyChart;

    async function init() {
        if (window.location.protocol === 'file:') {
            showProtocolWarning();
            return;
        }
        initCharts();
        try {
            const { data: { session }, error } = await db.auth.getSession();
            if (session) { user = session.user; await loadData(); showApp(); }
            else showAuth();
        } catch (e) { showAuth(); }
    }

    function showProtocolWarning() {
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.98);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(20px)';
        div.innerHTML = `
            <div class="glass-card" style="max-width:600px;text-align:left;padding:40px;border:1px solid #ef4444">
                <h2 style="color:#ef4444;margin-bottom:20px;display:flex;align-items:center;gap:12px"><i data-lucide="shield-alert"></i> 浏览器安全限制</h2>
                <p style="color:var(--text-main);margin-bottom:24px;line-height:1.8">您当前通过 <b>file://</b> 协议（直接双击文件）打开。由于浏览器的安全策略，Supabase 功能在此模式下会被禁用。</p>
                <div style="background:rgba(239,68,68,0.1);padding:20px;border-radius:16px;margin-bottom:20px;border-left:4px solid #ef4444">
                    <p style="font-weight:700;margin-bottom:10px;color:#fca5a5">解决方案：请通过本地服务器运行</p>
                    <ul style="font-size:14px;color:var(--text-muted);line-height:2;list-style:none;padding:0">
                        <li>✅ <b>VS Code</b>：右键 HTML 选择 "Open with Live Server"</li>
                        <li>✅ <b>Python</b>：终端输入 <code>python -m http.server</code></li>
                        <li>✅ <b>Node</b>：终端输入 <code>npx serve</code></li>
                    </ul>
                </div>
                <p style="font-size:13px;color:var(--text-muted)">服务器启动后，请通过 <b>http://localhost</b> 访问。</p>
            </div>
        `;
        document.body.appendChild(div);
        lucide.createIcons();
    }

    function showAuth() { document.getElementById('auth-view').classList.add('active'); document.getElementById('main-sidebar').classList.add('hidden'); document.getElementById('main-app').classList.add('hidden'); }
    function showApp() { document.getElementById('auth-view').classList.remove('active'); document.getElementById('main-sidebar').classList.remove('hidden'); document.getElementById('main-app').classList.remove('hidden'); }

    function switchTab(name) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        const tab = document.getElementById('tab-' + name); if(tab) tab.classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-link[onclick*="${name}"]`); if(activeLink) activeLink.classList.add('active');
    }

    const authToggle = document.getElementById('auth-toggle');
    let isLogin = true;
    authToggle.onclick = () => {
        isLogin = !isLogin;
        const title = document.getElementById('auth-title');
        if (title) title.innerText = isLogin ? '番茄英雄' : '注册英雄';
        const submit = document.getElementById('auth-submit');
        if (submit) submit.innerText = isLogin ? '进入竞技场' : '完成注册';
        authToggle.innerHTML = isLogin ? '新挑战者？ <span class="text-rose">立即注册</span>' : '已有账号？ <span class="text-rose">去登录</span>';
        const userGroup = document.getElementById('username-group');
        if (userGroup) userGroup.classList.toggle('hidden', isLogin);
    };

    document.getElementById('auth-submit').onclick = async () => {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value;
        if (!email || !password) return alert("请填写信息");
        try {
            if (isLogin) {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error; user = data.user;
            } else {
                const { data, error } = await db.auth.signUp({ email, password, options: { data: { username: username || email.split('@')[0] } } });
                if (error) { if(error.status===422) alert("密码需至少6位"); else throw error; return; }
                user = data.user; if (!data.session) return alert("账号已创建，请查收邮件或直接尝试登录");
            }
            await loadData(); showApp();
        } catch (e) { alert("认证失败: " + e.message); }
    };

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
        logoutBtn.onclick = async () => { await db.auth.signOut(); location.reload(); };
    }

    async function loadData() {
        if (!user) return;
        try {
            let { data: prof, error: profErr } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
            if (profErr && profErr.status === 404) return showSetupGuide();
            if (!prof) {
                const initProf = { id: user.id, username: user.user_metadata.username || user.email.split('@')[0], level: 1, exp: 0, total_tomatoes: 0 };
                const { data } = await db.from('profiles').insert(initProf).select().single();
                prof = data || initProf;
            }
            profile = prof;
            const { data: sess } = await db.from('tomato_sessions').select('*').eq('user_id', user.id);
            sessions = sess || [];
            updateUI(); updateCharts(); refreshLeaderboard();
        } catch (e) { console.error(e); }
    }

    function showSetupGuide() {
        if (document.getElementById('setup-overlay')) return;
        const div = document.createElement('div'); div.id = 'setup-overlay';
        div.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.98);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(15px)';
        const sql = `CREATE TABLE IF NOT EXISTS public.profiles (id UUID REFERENCES auth.users ON DELETE CASCADE PRIMARY KEY, username TEXT, level INT DEFAULT 1, exp INT DEFAULT 0, total_tomatoes INT DEFAULT 0, updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW());
CREATE TABLE IF NOT EXISTS public.tomato_sessions (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, user_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL, completed_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(), duration INT, task_name TEXT DEFAULT '专注任务');
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY; ALTER TABLE public.tomato_sessions ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Profiles public" ON public.profiles FOR SELECT USING (true);
CREATE POLICY "Profile update" ON public.profiles FOR ALL USING (auth.uid() = id);
CREATE POLICY "Session privacy" ON public.tomato_sessions FOR ALL USING (auth.uid() = user_id);
GRANT ALL ON public.profiles TO anon, authenticated, service_role; GRANT ALL ON public.tomato_sessions TO anon, authenticated, service_role;`;
        div.innerHTML = `<div class="glass-card" style="max-width:600px; text-align:left;">
            <h2 style="color:var(--primary); margin-bottom:15px;">数据库未就绪</h2>
            <p style="color:var(--text-muted); margin-bottom:15px;">请在 Supabase SQL Editor 运行以下代码：</p>
            <textarea readonly style="width:100%; height:150px; background:#000; color:#0f0; font-family:monospace; padding:10px; margin-bottom:15px;">${sql}</textarea>
            <button class="btn btn-primary" style="width:100%" onclick="location.reload()">已运行，刷新重连</button>
        </div>`;
        document.body.appendChild(div);
    }

    const slider = document.getElementById('timer-slider');
    if (slider) {
        slider.oninput = () => {
            if (!timer.isRunning) {
                const valEl = document.getElementById('timer-setting-val');
                if (valEl) valEl.innerText = slider.value;
                timer.totalSeconds = slider.value * 60;
                timer.remainingSeconds = timer.totalSeconds;
                updateTimerUI();
            }
        };
    }

    document.getElementById('timer-start').onclick = () => {
        if (timer.isRunning) return;
        timer.currentTask = document.getElementById('task-name-input').value.trim() || '专注任务';
        if (timer.currentTask && !recentTasks.includes(timer.currentTask)) { recentTasks.unshift(timer.currentTask); recentTasks = recentTasks.slice(0, 5); localStorage.setItem('recent_tasks', JSON.stringify(recentTasks)); renderRecentTasks(); }
        timer.isRunning = true; document.getElementById('timer-start').classList.add('hidden'); document.getElementById('timer-stop').classList.remove('hidden');
        timer.interval = setInterval(() => { if (timer.remainingSeconds > 0) { timer.remainingSeconds--; updateTimerUI(); } else { completeSession(); } }, 1000);
    };

    document.getElementById('timer-stop').onclick = () => { if (confirm("放弃？")) { timer.streak = 0; resetTimer(); } };

    async function completeSession() {
        clearInterval(timer.interval); timer.isRunning = false;
        const modeBadge = document.getElementById('mode-badge');
        const timerBar = document.getElementById('timer-bar');
        const sliderValue = slider ? parseInt(slider.value) : 25;

        if (timer.mode === 'work') {
            timer.streak++; const exp = sliderValue * 4 + (timer.streak > 1 ? 50 : 0); const oldLvl = profile.level;
            profile.exp += exp; profile.total_tomatoes += 1; profile.level = calculateLevel(profile.exp);

            await db.from('tomato_sessions').insert({ user_id: user.id, duration: sliderValue, task_name: timer.currentTask });
            await db.from('profiles').upsert({ id: user.id, exp: profile.exp, level: profile.level, total_tomatoes: profile.total_tomatoes });

            spawnXPEffect(exp); if (profile.level > oldLvl) showLevelUp();

            timer.mode = 'break'; const breakTime = (timer.streak % 4 === 0) ? 15 : 5; timer.totalSeconds = breakTime * 60;
            if (modeBadge) modeBadge.innerText = '恢复休整';
            if (timerBar) timerBar.style.stroke = 'var(--secondary)';
        } else {
            timer.mode = 'work'; timer.totalSeconds = sliderValue * 60;
            if (modeBadge) modeBadge.innerText = '准备专注';
            if (timerBar) timerBar.style.stroke = 'var(--primary)';
        }
        timer.remainingSeconds = timer.totalSeconds; resetTimer(); loadData();
    }

    function resetTimer() { clearInterval(timer.interval); timer.isRunning = false; document.getElementById('timer-start').classList.remove('hidden'); document.getElementById('timer-stop').classList.add('hidden'); updateTimerUI(); }

    function updateUI() {
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        set('display-username', profile.username); set('display-level', profile.level); set('display-title', getTitle(profile.level));
        set('stat-today-time', sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === new Date().toLocaleDateString()).reduce((a,b)=>a+(b.duration||0),0));
        set('stat-total-tomatoes', profile.total_tomatoes);
        const cur = getExpInLevel(profile.exp, profile.level), req = getRequiredExp(profile.level);
        const fill = document.getElementById('exp-fill'); if (fill) fill.style.width = (cur/req*100)+'%';
        renderRecentTasks(); updateTimerUI();
    }

    function updateTimerUI() {
        const m = Math.floor(timer.remainingSeconds / 60), s = timer.remainingSeconds % 60;
        const txt = document.getElementById('timer-text'); if(txt) txt.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        const bar = document.getElementById('timer-progress'); if(bar) bar.style.strokeDashoffset = 879.6 * (1 - timer.remainingSeconds / timer.totalSeconds);
    }

    function renderRecentTasks() {
        const list = document.getElementById('recent-tasks-list'); if(!list) return;
        list.innerHTML = recentTasks.map(t => `<span class="chip" style="padding:5px 10px; background:rgba(255,255,255,0.1); border-radius:10px; cursor:pointer;" onclick="document.getElementById('task-name-input').value='${t}'">${t}</span>`).join('');
    }

    function initCharts() {
        const common = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } };
        const tc = document.getElementById('taskChart'); if(tc) taskChart = new Chart(tc, { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: ['#F43F5E', '#10B981', '#3B82F6'] }] }, options: common });
        const wc = document.getElementById('weeklyChart'); if(wc) weeklyChart = new Chart(wc, { type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: '#F43F5E' }] }, options: common });
    }

    function updateCharts() {
        if(!taskChart || !weeklyChart) return;
        const today = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === new Date().toLocaleDateString());
        const taskMap = {}; today.forEach(s => taskMap[s.task_name] = (taskMap[s.task_name] || 0) + s.duration);
        taskChart.data.labels = Object.keys(taskMap); taskChart.data.datasets[0].data = Object.values(taskMap); taskChart.update();
        const weekly = Array(7).fill(0); const labels = [];
        for(let i=6; i>=0; i--) { const d = new Date(); d.setDate(d.getDate()-i); labels.push(d.toLocaleDateString('zh-CN', {weekday:'short'})); weekly[6-i] = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === d.toLocaleDateString()).length; }
        weeklyChart.data.labels = labels; weeklyChart.data.datasets[0].data = weekly; weeklyChart.update();
    }

    async function refreshLeaderboard() {
        const { data } = await db.from('profiles').select('username, total_tomatoes, level').order('total_tomatoes', { ascending: false }).limit(5);
        const list = document.getElementById('leaderboard-list'); if(data && list) list.innerHTML = data.map((u, i) => `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid rgba(255,255,255,0.1);"><span>${i+1}. ${u.username}</span><span>LV.${u.level} | ${u.total_tomatoes} 🍅</span></div>`).join('');
    }

    function spawnXPEffect(exp) {
        const el = document.createElement('div'); el.className = 'floating-xp'; el.innerText = `+${exp} EXP`;
        const anc = document.getElementById('timer-anchor'); if(anc) { const r = anc.getBoundingClientRect(); el.style.left = (r.left+r.width/2)+'px'; el.style.top = (r.top+r.height/2)+'px'; }
        document.body.appendChild(el); setTimeout(() => el.remove(), 1500);
    }

    function showLevelUp() { document.getElementById('level-up-modal').classList.remove('hidden'); }
    function calculateLevel(exp) { let lvl = 1, req = 300, total = 0; while (exp >= total + req) { total += req; lvl++; req *= 1.5; } return lvl; }
    function getRequiredExp(lvl) { let req = 300; for(let i=1; i<lvl; i++) req *= 1.5; return req; }
    function getExpInLevel(exp, lvl) { let total = 0, req = 300; for(let i=1; i<lvl; i++) { total += req; req *= 1.5; } return exp - total; }
    function getTitle(lvl) { if (lvl >= 20) return "至尊番茄英雄"; if (lvl >= 15) return "传奇时间领主"; if (lvl >= 10) return "大师级魔法师"; if (lvl >= 5) return "无畏专注骑士"; return "新晋进修学徒"; }

    init();
</script>
<style>.floating-xp { position: fixed; pointer-events: none; color: var(--accent); font-weight: 800; font-size: 36px; z-index: 10000; text-shadow: 0 10px 20px rgba(0,0,0,0.5); animation: floatUp 1.8s forwards; } @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }</style>
</body>
