<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Hero | Professional Focus Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0F172A;
            --bg-card: #1E293B;
            --bg-surface: rgba(30, 41, 59, 0.7);
            --primary: #F43F5E;
            --primary-glow: rgba(244, 63, 94, 0.3);
            --secondary: #10B981;
            --secondary-glow: rgba(16, 185, 129, 0.3);
            --accent: #F59E0B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(148, 163, 184, 0.1);
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(244, 63, 94, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 80px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 40px 20px;
        }

        /* --- Components --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(244, 63, 94, 0.2);
            transform: translateY(-2px);
        }

        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* --- Auth View --- */
        .auth-view {
            max-width: 440px;
            margin: 60px auto;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 32px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #F43F5E, #FB7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            gap: 10px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #F43F5E, #E11D48);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(244, 63, 94, 0.5);
        }

        .btn-primary:active { transform: translateY(1px); }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: var(--glass);
        }

        /* --- Timer Section --- */
        .timer-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px;
        }

        .timer-display-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 40px;
        }

        .timer-svg-pro { transform: rotate(-90deg); }

        .timer-track {
            fill: none;
            stroke: rgba(148, 163, 184, 0.05);
            stroke-width: 10;
        }

        .timer-bar {
            fill: none;
            stroke: var(--primary);
            stroke-width: 10;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px var(--primary-glow));
            transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s;
        }

        .timer-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-value {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }

        .time-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* --- Task & Config --- */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .task-input-wrapper {
            position: relative;
        }

        .task-input-wrapper input {
            width: 100%;
            background: var(--glass);
            border: 1.5px solid var(--border);
            padding: 16px 20px;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: var(--transition);
        }

        .task-input-wrapper input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.4);
        }

        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .chip {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-glow);
        }

        .slider-box {
            padding: 20px;
            background: var(--glass);
            border-radius: 16px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 100px;
            appearance: none;
            margin: 15px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- Profile Header --- */
        .profile-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--glass);
            padding: 8px 16px 8px 8px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .exp-progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            overflow: hidden;
            margin-top: 8px;
        }

        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #F43F5E, #F59E0B);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Analytics --- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--glass);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            display: block;
        }

        .stat-lbl {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Animations --- */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        .floating-xp {
            position: fixed;
            color: var(--accent);
            font-weight: 800;
            font-size: 32px;
            pointer-events: none;
            z-index: 9999;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: floatUp 1.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        /* --- Utils --- */
        .hidden { display: none !important; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.6s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth View -->
    <div id="auth-view" class="view active">
        <div class="auth-view card">
            <div class="auth-header">
                <h1>POMODORO HERO</h1>
                <p style="color: var(--text-muted); margin-bottom: 40px;">Step into the arena of elite focus.</p>
            </div>

            <div id="username-group" class="input-group hidden">
                <label>HERO NAME</label>
                <input type="text" id="auth-username" placeholder="Your legendary name">
            </div>

            <div class="input-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="auth-email" placeholder="hero@empire.com">
            </div>

            <div class="input-group">
                <label>ACCESS KEY (PASSWORD)</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" id="auth-submit">ENTER THE ARENA</button>

            <p id="auth-toggle" style="margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;">
                New challenger? <span style="color: var(--primary);">Join the ranks</span>
            </p>
        </div>
    </div>

    <!-- Main View -->
    <div id="app-view" class="view">
        <nav class="profile-nav">
            <div class="user-pill">
                <div class="avatar" id="user-avatar">H</div>
                <div>
                    <div id="display-username" style="font-weight: 800; font-size: 16px;">Hero</div>
                    <div id="display-title" style="font-size: 12px; font-weight: 600; color: var(--primary);">新手学徒</div>
                </div>
            </div>
            <button class="btn btn-outline" id="logout-btn" style="width: auto; padding: 10px 20px; font-size: 13px;">EXIT ARENA</button>
        </nav>

        <div class="card" style="padding: 24px;">
            <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700;">
                <span>RANK <span id="display-level">1</span></span>
                <span style="color: var(--text-muted);"><span id="display-exp">0</span> / <span id="display-next-exp">300</span> XP</span>
            </div>
            <div class="exp-progress-container">
                <div class="exp-bar-fill" id="exp-fill"></div>
            </div>
        </div>

        <div class="card timer-hero">
            <div id="timer-mode-label" style="font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;">READY FOR FOCUS</div>

            <div class="timer-display-wrapper" id="timer-anchor">
                <svg class="timer-svg-pro" width="280" height="280">
                    <circle class="timer-track" cx="140" cy="140" r="130"></circle>
                    <circle class="timer-bar" id="timer-progress" cx="140" cy="140" r="130" stroke-dasharray="816.8" stroke-dashoffset="0"></circle>
                </svg>
                <div class="timer-content">
                    <span class="time-value" id="timer-text">25:00</span>
                    <span class="time-label">minutes</span>
                </div>
            </div>

            <div style="width: 100%; max-width: 400px; display: flex; gap: 16px;">
                <button class="btn btn-primary" id="timer-start">IGNITE FOCUS</button>
                <button class="btn btn-outline hidden" id="timer-stop">ABANDON</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 24px; font-size: 20px;">MISSION CONFIG</h3>
            <div class="config-grid">
                <div class="task-input-wrapper">
                    <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;">CURRENT OBJECTIVE</label>
                    <input type="text" id="task-name-input" placeholder="What are you conquering today?">
                    <div class="chip-group" id="recent-tasks-list"></div>
                </div>

                <div class="slider-box">
                    <label style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
                        DURATION <span><span id="timer-setting-val">25</span> MIN</span>
                    </label>
                    <input type="range" id="timer-slider" min="5" max="120" value="25" step="5">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 24px; font-size: 20px;">BATTLE ANALYTICS</h3>
            <div class="grid-2">
                <div class="stat-card">
                    <span class="stat-val" id="stat-today-time">0</span>
                    <span class="stat-lbl">TODAY'S MINS</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-total-tomatoes">0</span>
                    <span class="stat-lbl">LIFETIME HEROES</span>
                </div>
            </div>

            <div style="margin-bottom: 32px;">
                <h4 style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">FOCUS DISTRIBUTION</h4>
                <div style="height: 240px;">
                    <canvas id="taskChart"></canvas>
                </div>
            </div>

            <div>
                <h4 style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">WEEKLY MOMENTUM</h4>
                <div style="height: 240px;">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 24px; font-size: 20px;">GLOBAL HEROES</h3>
            <div id="leaderboard-list"></div>
        </div>
    </div>
</div>

<!-- Overlays -->
<div id="level-up-overlay">
    <h1 style="color: var(--accent); font-size: 72px; text-shadow: 0 0 30px var(--accent);">RANK UP!</h1>
    <p id="new-title-display" style="font-size: 24px; font-weight: 700; margin: 20px 0;">LEGENDARY TOMATO KING</p>
    <button class="btn btn-primary" style="width: auto; padding: 16px 48px;" onclick="document.getElementById('level-up-overlay').style.display='none'">CONTINUE CONQUEST</button>
</div>

<script>
    // --- Config & State ---
    const SUPABASE_URL = 'https://htshfxvqsscgdzjcrcpr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7I655eAMx6ZCbBiUlwisoA__bpEgH3X';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let user = null;
    let profile = { id: '', username: 'Hero', level: 1, exp: 0, total_tomatoes: 0 };
    let sessions = [];
    let recentTasks = JSON.parse(localStorage.getItem('recent_tasks') || '["Coding", "Learning", "Workout", "Reading"]');

    let timer = {
        totalSeconds: 25 * 60,
        remainingSeconds: 25 * 60,
        interval: null,
        isRunning: false,
        mode: 'work',
        streak: 0,
        currentTask: ''
    };

    let taskChart, weeklyChart;

    // --- Core Logic ---
    async function init() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            user = session.user;
            await loadData();
            showView('app');
        } else {
            showView('auth');
        }
        initCharts();
        updateUI();
    }

    function showView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(name + '-view').classList.add('active');
    }

    // --- Auth Logic ---
    const authToggle = document.getElementById('auth-toggle');
    let isLogin = true;
    authToggle.onclick = () => {
        isLogin = !isLogin;
        document.querySelector('.auth-header h1').innerText = isLogin ? 'POMODORO HERO' : 'JOIN THE HEROES';
        document.getElementById('auth-submit').innerText = isLogin ? 'ENTER THE ARENA' : 'CREATE ACCOUNT';
        authToggle.innerHTML = isLogin ? 'New challenger? <span style="color: var(--primary);">Join the ranks</span>' : 'Already a hero? <span style="color: var(--primary);">Sign in</span>';
        document.getElementById('username-group').classList.toggle('hidden', isLogin);
    };

    document.getElementById('auth-submit').onclick = async () => {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value;

        try {
            if (isLogin) {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                user = data.user;
            } else {
                const { data, error } = await db.auth.signUp({
                    email, password, options: { data: { username: username || email.split('@')[0] } }
                });
                if (error) throw error;
                user = data.user;
                if (!data.session) return alert("Account created! Check your email or sign in.");
            }
            await loadData();
            showView('app');
        } catch (e) { alert(e.message); }
    };

    document.getElementById('logout-btn').onclick = async () => {
        await db.auth.signOut();
        location.reload();
    };

    // --- Data Service ---
    async function loadData() {
        if (!user) return;
        let { data: prof } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (!prof) {
            const initial = { id: user.id, username: user.user_metadata.username || user.email.split('@')[0], level: 1, exp: 0, total_tomatoes: 0 };
            const { data } = await db.from('profiles').insert(initial).select().single();
            prof = data || initial;
        }
        profile = prof;
        const { data: sess } = await db.from('tomato_sessions').select('*').eq('user_id', user.id);
        sessions = sess || [];
        updateUI();
        updateCharts();
        refreshLeaderboard();
    }

    // --- Timer Logic ---
    const slider = document.getElementById('timer-slider');
    slider.oninput = () => {
        if (!timer.isRunning) {
            document.getElementById('timer-setting-val').innerText = slider.value;
            timer.totalSeconds = slider.value * 60;
            timer.remainingSeconds = timer.totalSeconds;
            updateTimerUI();
        }
    };

    document.getElementById('timer-start').onclick = () => {
        if (timer.isRunning) return;
        timer.currentTask = document.getElementById('task-name-input').value.trim() || 'Hero Session';

        if (timer.currentTask && !recentTasks.includes(timer.currentTask)) {
            recentTasks.unshift(timer.currentTask);
            recentTasks = recentTasks.slice(0, 6);
            localStorage.setItem('recent_tasks', JSON.stringify(recentTasks));
            renderRecentTasks();
        }

        timer.isRunning = true;
        document.getElementById('timer-start').classList.add('hidden');
        document.getElementById('timer-stop').classList.remove('hidden');
        timer.interval = setInterval(tick, 1000);
    };

    document.getElementById('timer-stop').onclick = () => {
        if (confirm("Abandon conquest? All current progress will be lost.")) {
            timer.streak = 0;
            resetTimer();
        }
    };

    function tick() {
        if (timer.remainingSeconds > 0) {
            timer.remainingSeconds--;
            updateTimerUI();
        } else {
            completeTimer();
        }
    }

    async function completeTimer() {
        clearInterval(timer.interval);
        timer.isRunning = false;

        if (timer.mode === 'work') {
            timer.streak++;
            const exp = parseInt(slider.value) * 4 + (timer.streak > 1 ? 50 : 0);
            const oldLvl = profile.level;

            profile.exp += exp;
            profile.total_tomatoes += 1;
            profile.level = calculateLevel(profile.exp);

            await db.from('tomato_sessions').insert({ user_id: user.id, duration: parseInt(slider.value), task_name: timer.currentTask });
            await db.from('profiles').upsert({ id: user.id, exp: profile.exp, level: profile.level, total_tomatoes: profile.total_tomatoes });

            spawnXPEffect(exp);
            if (profile.level > oldLvl) showLevelUp();

            timer.mode = 'break';
            const breakTime = (timer.streak % 4 === 0) ? 15 : 5;
            timer.totalSeconds = breakTime * 60;
            document.getElementById('timer-mode-label').innerText = 'RECOVERY MODE';
            document.getElementById('timer-progress').style.stroke = 'var(--secondary)';
            document.getElementById('timer-progress').style.filter = 'drop-shadow(0 0 8px var(--secondary-glow))';
        } else {
            timer.mode = 'work';
            timer.totalSeconds = slider.value * 60;
            document.getElementById('timer-mode-label').innerText = 'READY FOR FOCUS';
            document.getElementById('timer-progress').style.stroke = 'var(--primary)';
            document.getElementById('timer-progress').style.filter = 'drop-shadow(0 0 8px var(--primary-glow))';
        }

        timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        updateTimerUI();
        loadData();
    }

    function resetTimer() {
        clearInterval(timer.interval);
        timer.isRunning = false;
        timer.mode = 'work';
        timer.totalSeconds = slider.value * 60;
        timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        updateTimerUI();
    }

    // --- UI Rendering ---
    function updateUI() {
        document.getElementById('display-username').innerText = profile.username;
        document.getElementById('user-avatar').innerText = profile.username.charAt(0).toUpperCase();
        document.getElementById('display-title').innerText = getTitle(profile.level);
        document.getElementById('display-level').innerText = profile.level;
        document.getElementById('display-exp').innerText = Math.floor(getExpInLevel(profile.exp, profile.level));
        document.getElementById('display-next-exp').innerText = Math.floor(getRequiredExp(profile.level));
        document.getElementById('exp-fill').style.width = (getExpInLevel(profile.exp, profile.level) / getRequiredExp(profile.level) * 100) + '%';
        document.getElementById('stat-total-tomatoes').innerText = profile.total_tomatoes;
        renderRecentTasks();
        updateTimerUI();
    }

    function updateTimerUI() {
        const m = Math.floor(timer.remainingSeconds / 60);
        const s = timer.remainingSeconds % 60;
        document.getElementById('timer-text').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        const offset = 816.8 * (1 - timer.remainingSeconds / timer.totalSeconds);
        document.getElementById('timer-progress').style.strokeDashoffset = offset;
    }

    function renderRecentTasks() {
        document.getElementById('recent-tasks-list').innerHTML = recentTasks.map(t => `<span class="chip" onclick="document.getElementById('task-name-input').value='${t}'">${t}</span>`).join('');
    }

    // --- Analytics ---
    function initCharts() {
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94A3B8' } },
                x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
            }
        };

        taskChart = new Chart(document.getElementById('taskChart'), {
            type: 'doughnut',
            data: { labels: [], datasets: [{ data: [], backgroundColor: ['#F43F5E', '#10B981', '#3B82F6', '#F59E0B', '#8B5CF6'], borderWidth: 0 }] },
            options: { ...commonOptions, plugins: { legend: { display: true, position: 'right', labels: { color: '#F8FAFC', font: { size: 10 } } } } }
        });

        weeklyChart = new Chart(document.getElementById('weeklyChart'), {
            type: 'line',
            data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ data: [], borderColor: '#F43F5E', backgroundColor: 'rgba(244, 63, 94, 0.1)', fill: true, tension: 0.4 }] },
            options: commonOptions
        });
    }

    function updateCharts() {
        const todayStr = new Date().toLocaleDateString();
        const todaySessions = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === todayStr);
        document.getElementById('stat-today-time').innerText = todaySessions.reduce((acc, s) => acc + s.duration, 0);

        const taskMap = {};
        todaySessions.forEach(s => taskMap[s.task_name] = (taskMap[s.task_name] || 0) + s.duration);
        taskChart.data.labels = Object.keys(taskMap);
        taskChart.data.datasets[0].data = Object.values(taskMap);
        taskChart.update();

        // Weekly (Last 7 days)
        const weeklyData = Array(7).fill(0);
        const dayLabels = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            dayLabels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
            const count = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === d.toLocaleDateString()).length;
            weeklyData[6-i] = count;
        }
        weeklyChart.data.labels = dayLabels;
        weeklyChart.data.datasets[0].data = weeklyData;
        weeklyChart.update();
    }

    async function refreshLeaderboard() {
        const { data } = await db.from('profiles').select('username, total_tomatoes, level').order('total_tomatoes', { ascending: false }).limit(5);
        if (data) {
            document.getElementById('leaderboard-list').innerHTML = data.map((u, i) => `
                <div style="display: flex; align-items: center; gap: 16px; background: var(--glass); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border);">
                    <span style="font-size: 20px; font-weight: 800; color: ${i===0?'#F59E0B':'var(--text-muted)'}">${i+1}</span>
                    <div style="flex-grow: 1;">
                        <div style="font-weight: 800;">${u.username}</div>
                        <div style="font-size: 11px; font-weight: 700; color: var(--primary);">LV.${u.level} ${getTitle(u.level)}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 18px; font-weight: 800; color: var(--primary);">${u.total_tomatoes}</div>
                        <div style="font-size: 10px; font-weight: 600; color: var(--text-muted);">TOMATOES</div>
                    </div>
                </div>
            `).join('');
        }
    }

    // --- Visual FX ---
    function spawnXPEffect(exp) {
        const el = document.createElement('div');
        el.className = 'floating-xp';
        el.innerText = `+${exp} XP`;
        el.style.left = (window.innerWidth / 2 - 40) + 'px';
        el.style.top = (window.innerHeight / 2) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    function showLevelUp() {
        document.getElementById('new-title-display').innerText = getTitle(profile.level);
        document.getElementById('level-up-overlay').style.display = 'flex';
    }

    // --- Formulas ---
    function calculateLevel(exp) { let lvl = 1, req = 300, total = 0; while (exp >= total + req) { total += req; lvl++; req *= 1.5; } return lvl; }
    function getRequiredExp(lvl) { let req = 300; for(let i=1; i<lvl; i++) req *= 1.5; return req; }
    function getExpInLevel(exp, lvl) { let total = 0, req = 300; for(let i=1; i<lvl; i++) { total += req; req *= 1.5; } return exp - total; }
    function getTitle(lvl) { if (lvl >= 20) return "LEGENDARY TOMATO KING"; if (lvl >= 10) return "TIME MAGE"; if (lvl >= 5) return "FOCUS KNIGHT"; return "NOVICE APPRENTICE"; }

    init();
</script>
</body>
</html>
