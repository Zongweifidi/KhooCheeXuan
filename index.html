<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Hero | Elite Focus Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary: #F43F5E;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --secondary: #10B981;
            --secondary-glow: rgba(16, 185, 129, 0.4);
            --accent: #F59E0B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            line-height: 1.5;
        }

        /* --- Animated Mesh Background --- */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            background: var(--bg-deep);
        }

        .mesh-circle {
            position: absolute;
            filter: blur(100px);
            opacity: 0.4;
            border-radius: 50%;
            animation: meshMove 20s infinite alternate;
        }

        .circle-1 { width: 500px; height: 500px; background: #F43F5E; top: -100px; left: -100px; animation-delay: 0s; }
        .circle-2 { width: 400px; height: 400px; background: #3B82F6; bottom: -50px; right: -50px; animation-delay: -5s; }
        .circle-3 { width: 300px; height: 300px; background: #10B981; top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes meshMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 40px 20px 100px;
            position: relative;
            z-index: 1;
        }

        /* --- Global Card Styling --- */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.05);
            margin-bottom: 32px;
            transition: var(--transition);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Typography --- */
        h1, h2, h3 { font-weight: 800; letter-spacing: -0.03em; }
        .section-title { font-size: 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--text-main); }
        .section-title i { color: var(--primary); }

        /* --- Timer: The Focal Point --- */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0;
            text-align: center;
        }

        .timer-outer {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .timer-svg { transform: rotate(-90deg); filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }

        .timer-track { fill: none; stroke: rgba(255, 255, 255, 0.03); stroke-width: 12; }

        .timer-bar {
            fill: none;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 942;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s, filter 0.5s;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .timer-inner {
            position: absolute;
            inset: 20px;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, transparent 80%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-val { font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -3px; margin-bottom: 4px; }
        .timer-lbl { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; }

        /* --- Action Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #F43F5E 0%, #E11D48 100%);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 35px -5px rgba(244, 63, 94, 0.6);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
        }

        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }

        /* --- Dashboard Stats --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card-inner {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 22px;
            padding: 24px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .stat-icon {
            width: 44px; height: 44px;
            background: rgba(244, 63, 94, 0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .stat-numb { font-size: 32px; font-weight: 800; color: var(--text-main); line-height: 1.2; }
        .stat-desc { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* --- User Profile Nav --- */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px 8px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 100px;
            border: 1px solid var(--glass-border);
        }

        .user-avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #F43F5E, #F59E0B);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* --- Progress Bar --- */
        .progress-box { margin-bottom: 40px; }
        .progress-meta { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
        .progress-track { height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 100px; overflow: hidden; padding: 2px; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F43F5E, #F59E0B);
            width: 0%;
            border-radius: 100px;
            transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- Chips & Inputs --- */
        .config-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: var(--transition);
        }
        .config-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        .chip {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
        }
        .chip:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-glow); }

        /* --- Auth Page Specific --- */
        .auth-view { max-width: 460px; margin: 80px auto; }
        .auth-logo { margin-bottom: 32px; font-size: 32px; font-weight: 800; background: linear-gradient(to right, #F43F5E, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Overlays --- */
        #level-up-modal {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5000; backdrop-filter: blur(10px);
        }

        .floating-xp {
            position: fixed; pointer-events: none; color: var(--accent); font-weight: 800; font-size: 36px;
            z-index: 10000; text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: floatUp 1.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }

        .hidden { display: none !important; }
        .view { display: none; }
        .view.active { display: block; animation: viewEnter 0.7s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes viewEnter { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>

<div class="mesh-bg">
    <div class="mesh-circle circle-1"></div>
    <div class="mesh-circle circle-2"></div>
    <div class="mesh-circle circle-3"></div>
</div>
<div class="noise-overlay"></div>

<div class="container">
    <!-- Auth -->
    <div id="auth-view" class="view active">
        <div class="auth-view glass-card">
            <div style="text-align: center;">
                <h1 class="auth-logo">POMODORO HERO</h1>
                <p style="color: var(--text-muted); margin-bottom: 40px; font-weight: 500;">Master your time, forge your legacy.</p>
            </div>

            <div id="username-group" class="input-group hidden">
                <label>HERO NAME</label>
                <input type="text" id="auth-username" class="config-input" placeholder="Your display name">
            </div>

            <div class="input-group" style="margin-bottom: 20px;">
                <label>EMAIL</label>
                <input type="email" id="auth-email" class="config-input" placeholder="hero@dominion.com">
            </div>

            <div class="input-group" style="margin-bottom: 32px;">
                <label>KEY (PASSWORD)</label>
                <input type="password" id="auth-password" class="config-input" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" id="auth-submit">
                <span>ENTER THE ARENA</span>
                <i data-lucide="sword"></i>
            </button>

            <p id="auth-toggle" style="text-align: center; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;">
                First mission? <span style="color: var(--primary);">Join the Heroes</span>
            </p>
        </div>
    </div>

    <!-- App -->
    <div id="app-view" class="view">
        <header class="nav-header">
            <div class="user-profile">
                <div class="user-avatar" id="avatar-circle">H</div>
                <div>
                    <div id="display-username" style="font-weight: 800; font-size: 16px;">Hero</div>
                    <div id="display-title" style="font-size: 12px; font-weight: 700; color: var(--primary);">NOVICE APPRENTICE</div>
                </div>
            </div>
            <button class="btn btn-outline" id="logout-btn" style="width: auto; padding: 10px 20px; font-size: 13px;">
                <i data-lucide="log-out" style="width: 16px;"></i>
                <span>EXIT</span>
            </button>
        </header>

        <div class="progress-box">
            <div class="progress-meta">
                <span>RANK <span id="display-level">1</span></span>
                <span style="color: var(--text-muted);"><span id="display-exp">0</span> / <span id="display-next-exp">300</span> XP</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="exp-fill"></div>
            </div>
        </div>

        <section class="glass-card timer-section">
            <div id="mode-badge" style="background: rgba(244, 63, 94, 0.1); color: var(--primary); padding: 6px 16px; border-radius: 100px; font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-bottom: 24px;">READY FOR FOCUS</div>

            <div class="timer-outer" id="timer-anchor">
                <svg class="timer-svg" width="320" height="320">
                    <circle class="timer-track" cx="160" cy="160" r="150"></circle>
                    <circle class="timer-bar" id="timer-progress" cx="160" cy="160" r="150"></circle>
                </svg>
                <div class="timer-inner">
                    <span class="timer-val" id="timer-text">25:00</span>
                    <span class="timer-lbl">Minutes</span>
                </div>
            </div>

            <div style="width: 100%; max-width: 440px; display: flex; gap: 16px; padding: 0 20px;">
                <button class="btn btn-primary" id="timer-start">
                    <i data-lucide="play" fill="white"></i>
                    <span>IGNITE</span>
                </button>
                <button class="btn btn-outline hidden" id="timer-stop">
                    <i data-lucide="square" fill="white"></i>
                    <span>ABANDON</span>
                </button>
            </div>
        </section>

        <section class="glass-card">
            <h3 class="section-title"><i data-lucide="settings"></i> MISSION CONFIG</h3>
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">OBJECTIVE</label>
                <input type="text" id="task-name-input" class="config-input" placeholder="What is your focus?">
                <div class="chip-group" id="recent-tasks-list" style="margin-top: 12px;"></div>
            </div>

            <div>
                <label style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px;">
                    DURATION <span><span id="timer-setting-val" style="color: var(--primary); font-size: 16px;">25</span> MIN</span>
                </label>
                <input type="range" id="timer-slider" min="5" max="120" value="25" step="5">
            </div>
        </section>

        <section class="glass-card">
            <h3 class="section-title"><i data-lucide="bar-chart-2"></i> FOCUS ANALYTICS</h3>
            <div class="stats-grid">
                <div class="stat-card-inner">
                    <div class="stat-icon"><i data-lucide="clock"></i></div>
                    <span class="stat-numb" id="stat-today-time">0</span>
                    <span class="stat-desc">Today's Mins</span>
                </div>
                <div class="stat-card-inner">
                    <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--secondary);"><i data-lucide="target"></i></div>
                    <span class="stat-numb" id="stat-total-tomatoes">0</span>
                    <span class="stat-desc">Lifetime</span>
                </div>
            </div>

            <div style="margin-bottom: 40px;">
                <p style="font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 20px;">TASK DISTRIBUTION</p>
                <div style="height: 260px;"><canvas id="taskChart"></canvas></div>
            </div>

            <div>
                <p style="font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 20px;">7-DAY MOMENTUM</p>
                <div style="height: 260px;"><canvas id="weeklyChart"></canvas></div>
            </div>
        </section>

        <section class="glass-card">
            <h3 class="section-title"><i data-lucide="users"></i> TOP HEROES</h3>
            <div id="leaderboard-list"></div>
        </section>
    </div>
</div>

<!-- Overlays -->
<div id="level-up-modal">
    <div style="text-align: center;">
        <i data-lucide="zap" style="width: 80px; height: 80px; color: var(--accent); margin-bottom: 24px;"></i>
        <h1 style="color: var(--accent); font-size: 64px; margin-bottom: 10px;">RANK UP!</h1>
        <p id="new-title-display" style="font-size: 24px; font-weight: 700; margin-bottom: 40px;">LEGENDARY HERO</p>
        <button class="btn btn-primary" style="width: auto; padding: 16px 48px;" onclick="document.getElementById('level-up-modal').style.display='none'">ONWARD</button>
    </div>
</div>

<script>
    // Lucide Init
    lucide.createIcons();

    // --- Supabase & Logic ---
    const SUPABASE_URL = 'https://htshfxvqsscgdzjcrcpr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7I655eAMx6ZCbBiUlwisoA__bpEgH3X';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let user = null;
    let profile = { id: '', username: 'Hero', level: 1, exp: 0, total_tomatoes: 0 };
    let sessions = [];
    let recentTasks = JSON.parse(localStorage.getItem('recent_tasks') || '["Coding", "Design", "Study", "Gym"]');

    let timer = {
        totalSeconds: 25 * 60,
        remainingSeconds: 25 * 60,
        interval: null,
        isRunning: false,
        mode: 'work',
        streak: 0,
        currentTask: ''
    };

    let taskChart, weeklyChart;

    async function init() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            user = session.user;
            await loadData();
            showView('app');
        } else {
            showView('auth');
        }
        initCharts();
        updateUI();
    }

    function showView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(name + '-view').classList.add('active');
    }

    // --- Auth ---
    const authToggle = document.getElementById('auth-toggle');
    let isLogin = true;
    authToggle.onclick = () => {
        isLogin = !isLogin;
        document.querySelector('.auth-logo').innerText = isLogin ? 'POMODORO HERO' : 'JOIN THE HEROES';
        document.getElementById('auth-submit').querySelector('span').innerText = isLogin ? 'ENTER THE ARENA' : 'START JOURNEY';
        authToggle.innerHTML = isLogin ? 'First mission? <span style="color: var(--primary);">Join the Heroes</span>' : 'Returning? <span style="color: var(--primary);">Sign In</span>';
        document.getElementById('username-group').classList.toggle('hidden', isLogin);
    };

    document.getElementById('auth-submit').onclick = async () => {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value;
        try {
            if (isLogin) {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                user = data.user;
            } else {
                const { data, error } = await db.auth.signUp({ email, password, options: { data: { username: username || email.split('@')[0] } } });
                if (error) throw error;
                user = data.user;
                if (!data.session) return alert("Account created! Check email if verification enabled.");
            }
            await loadData();
            showView('app');
        } catch (e) { alert(e.message); }
    };

    document.getElementById('logout-btn').onclick = async () => {
        await db.auth.signOut();
        location.reload();
    };

    // --- Data ---
    async function loadData() {
        if (!user) return;
        let { data: prof } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (!prof) {
            const initial = { id: user.id, username: user.user_metadata.username || user.email.split('@')[0], level: 1, exp: 0, total_tomatoes: 0 };
            const { data } = await db.from('profiles').insert(initial).select().single();
            prof = data || initial;
        }
        profile = prof;
        const { data: sess } = await db.from('tomato_sessions').select('*').eq('user_id', user.id);
        sessions = sess || [];
        updateUI();
        updateCharts();
        refreshLeaderboard();
    }

    // --- Timer ---
    const slider = document.getElementById('timer-slider');
    slider.oninput = () => {
        if (!timer.isRunning) {
            document.getElementById('timer-setting-val').innerText = slider.value;
            timer.totalSeconds = slider.value * 60;
            timer.remainingSeconds = timer.totalSeconds;
            updateTimerUI();
        }
    };

    document.getElementById('timer-start').onclick = () => {
        if (timer.isRunning) return;
        timer.currentTask = document.getElementById('task-name-input').value.trim() || 'Hero Mission';
        if (timer.currentTask && !recentTasks.includes(timer.currentTask)) {
            recentTasks.unshift(timer.currentTask); recentTasks = recentTasks.slice(0, 5);
            localStorage.setItem('recent_tasks', JSON.stringify(recentTasks));
            renderRecentTasks();
        }
        timer.isRunning = true;
        document.getElementById('timer-start').classList.add('hidden');
        document.getElementById('timer-stop').classList.remove('hidden');
        timer.interval = setInterval(tick, 1000);
    };

    document.getElementById('timer-stop').onclick = () => {
        if (confirm("Abandon? No XP will be earned.")) {
            timer.streak = 0; resetTimer();
        }
    };

    function tick() {
        if (timer.remainingSeconds > 0) { timer.remainingSeconds--; updateTimerUI(); }
        else { completeSession(); }
    }

    async function completeSession() {
        clearInterval(timer.interval); timer.isRunning = false;
        if (timer.mode === 'work') {
            timer.streak++;
            const exp = parseInt(slider.value) * 4 + (timer.streak > 1 ? 50 : 0);
            const oldLvl = profile.level;
            profile.exp += exp; profile.total_tomatoes += 1; profile.level = calculateLevel(profile.exp);
            await db.from('tomato_sessions').insert({ user_id: user.id, duration: parseInt(slider.value), task_name: timer.currentTask });
            await db.from('profiles').upsert({ id: user.id, exp: profile.exp, level: profile.level, total_tomatoes: profile.total_tomatoes });
            spawnXPEffect(exp); if (profile.level > oldLvl) showLevelUp();
            timer.mode = 'break';
            const breakTime = (timer.streak % 4 === 0) ? 15 : 5;
            timer.totalSeconds = breakTime * 60;
            document.getElementById('mode-badge').innerText = 'RECOVERY';
            document.getElementById('mode-badge').style.color = 'var(--secondary)';
            document.getElementById('mode-badge').style.background = 'rgba(16, 185, 129, 0.1)';
            document.getElementById('timer-progress').style.stroke = 'var(--secondary)';
            document.getElementById('timer-progress').style.filter = 'drop-shadow(0 0 12px var(--secondary-glow))';
        } else {
            timer.mode = 'work';
            timer.totalSeconds = slider.value * 60;
            document.getElementById('mode-badge').innerText = 'FOCUS';
            document.getElementById('mode-badge').style.color = 'var(--primary)';
            document.getElementById('mode-badge').style.background = 'rgba(244, 63, 94, 0.1)';
            document.getElementById('timer-progress').style.stroke = 'var(--primary)';
            document.getElementById('timer-progress').style.filter = 'drop-shadow(0 0 12px var(--primary-glow))';
        }
        timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        updateTimerUI(); loadData();
    }

    function resetTimer() {
        clearInterval(timer.interval); timer.isRunning = false; timer.mode = 'work';
        timer.totalSeconds = slider.value * 60; timer.remainingSeconds = timer.totalSeconds;
        document.getElementById('timer-start').classList.remove('hidden');
        document.getElementById('timer-stop').classList.add('hidden');
        updateTimerUI();
    }

    function updateUI() {
        document.getElementById('display-username').innerText = profile.username;
        document.getElementById('avatar-circle').innerText = profile.username.charAt(0).toUpperCase();
        document.getElementById('display-title').innerText = getTitle(profile.level);
        document.getElementById('display-level').innerText = profile.level;
        document.getElementById('display-exp').innerText = Math.floor(getExpInLevel(profile.exp, profile.level));
        document.getElementById('display-next-exp').innerText = Math.floor(getRequiredExp(profile.level));
        document.getElementById('exp-fill').style.width = (getExpInLevel(profile.exp, profile.level) / getRequiredExp(profile.level) * 100) + '%';
        document.getElementById('stat-total-tomatoes').innerText = profile.total_tomatoes;
        renderRecentTasks(); updateTimerUI();
    }

    function updateTimerUI() {
        const m = Math.floor(timer.remainingSeconds / 60); const s = timer.remainingSeconds % 60;
        document.getElementById('timer-text').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        const offset = 942 * (1 - timer.remainingSeconds / timer.totalSeconds);
        document.getElementById('timer-progress').style.strokeDashoffset = offset;
    }

    function renderRecentTasks() {
        document.getElementById('recent-tasks-list').innerHTML = recentTasks.map(t => `<span class="chip" onclick="document.getElementById('task-name-input').value='${t}'">${t}</span>`).join('');
    }

    // --- Charts ---
    function initCharts() {
        const config = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                         scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#64748b' } } } };
        taskChart = new Chart(document.getElementById('taskChart'), {
            type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: ['#F43F5E', '#10B981', '#3B82F6', '#F59E0B', '#8B5CF6'], borderWidth: 0, cutout: '80%' }] },
            options: { ...config, plugins: { legend: { display: true, position: 'bottom', labels: { color: '#F8FAFC', font: { size: 10 } } } } }
        });
        weeklyChart = new Chart(document.getElementById('weeklyChart'), {
            type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: '#F43F5E', borderRadius: 8 }] },
            options: config
        });
    }

    function updateCharts() {
        const todayStr = new Date().toLocaleDateString();
        const todaySessions = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === todayStr);
        document.getElementById('stat-today-time').innerText = todaySessions.reduce((acc, s) => acc + s.duration, 0);
        const taskMap = {}; todaySessions.forEach(s => taskMap[s.task_name] = (taskMap[s.task_name] || 0) + s.duration);
        taskChart.data.labels = Object.keys(taskMap); taskChart.data.datasets[0].data = Object.values(taskMap);
        taskChart.update();
        const weeklyData = Array(7).fill(0); const dayLabels = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            dayLabels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
            weeklyData[6-i] = sessions.filter(s => new Date(s.completed_at).toLocaleDateString() === d.toLocaleDateString()).length;
        }
        weeklyChart.data.labels = dayLabels; weeklyChart.data.datasets[0].data = weeklyData; weeklyChart.update();
    }

    async function refreshLeaderboard() {
        const { data } = await db.from('profiles').select('username, total_tomatoes, level').order('total_tomatoes', { ascending: false }).limit(5);
        if (data) {
            document.getElementById('leaderboard-list').innerHTML = data.map((u, i) => `
                <div style="display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.02); padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border);">
                    <span style="font-size: 18px; font-weight: 800; color: ${i===0?'var(--accent)':'#475569'}">0${i+1}</span>
                    <div style="flex-grow: 1;">
                        <div style="font-weight: 800; font-size: 15px;">${u.username}</div>
                        <div style="font-size: 11px; font-weight: 700; color: var(--primary);">LV.${u.level}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 16px; font-weight: 800; color: var(--primary);">${u.total_tomatoes}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    function spawnXPEffect(exp) {
        const el = document.createElement('div'); el.className = 'floating-xp'; el.innerText = `+${exp} XP`;
        el.style.left = (window.innerWidth / 2 - 40) + 'px'; el.style.top = (window.innerHeight / 2) + 'px';
        document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
    }

    function showLevelUp() { document.getElementById('level-up-modal').style.display = 'flex'; }
    function calculateLevel(exp) { let lvl = 1, req = 300, total = 0; while (exp >= total + req) { total += req; lvl++; req *= 1.5; } return lvl; }
    function getRequiredExp(lvl) { let req = 300; for(let i=1; i<lvl; i++) req *= 1.5; return req; }
    function getExpInLevel(exp, lvl) { let total = 0, req = 300; for(let i=1; i<lvl; i++) { total += req; req *= 1.5; } return exp - total; }
    function getTitle(lvl) { if (lvl >= 20) return "LEGENDARY TOMATO KING"; if (lvl >= 10) return "TIME MAGE"; if (lvl >= 5) return "FOCUS KNIGHT"; return "NOVICE APPRENTICE"; }

    init();
</script>
</body>
</html>
